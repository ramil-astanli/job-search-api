services:
  postgres:
    image: 'postgres:15-alpine'
    container_name: 'job_search_db'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=ramil1234'
      - 'POSTGRES_USER=ramil'
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:latest'
    container_name: 'job_redis'
    ports:
      - '6380:6379'
volumes:
  postgres_data:
